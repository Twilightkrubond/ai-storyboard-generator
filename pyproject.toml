[build-system]
requires = ["setuptools>=69", "wheel", "pybind11>=2.12"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-storyboard-generator"
version = "0.9.4"
description = "AI storyboard generator — turn scripts, loglines, and reference sheets into shot-by-shot visual boards."
readme = "docs/ARCHITECTURE.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Sam Whitlock", email = "sam@fridgecut.dev" }]
keywords = ["storyboard", "ai", "previs", "filmmaking", "shotlist", "diffusion"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Artistic Software",
]
dependencies = [
    "PySide6>=6.7,<6.9",          # Qt6 GUI shell; 6.8 changed QThread affinity, pin below 6.9
    "pydantic>=2.7,<3",            # scene/shot schema validation
    "httpx>=0.27,<0.29",           # async calls to image backends
    "Pillow>=10.3,<12",
    "numpy>=1.26,<3",
    "tomli-w>=1.0",                # config writes
    "rich>=13.7",                  # CLI progress
    "typer>=0.12,<0.16",           # CLI entrypoints
    "watchdog>=4.0",               # hot-reload project files
]

[project.optional-dependencies]
cuda = ["torch>=2.4", "diffusers>=0.30"]
rocm = ["torch>=2.4", "diffusers>=0.30"]
dev = ["pytest>=8.2", "pytest-asyncio>=0.23", "ruff>=0.5", "mypy>=1.10", "pytest-qt>=4.4"]

[project.scripts]
storyboard = "storyboard.cli.app:main"
sbgen = "storyboard.cli.app:main"

[project.gui-scripts]
storyboard-desktop = "storyboard.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["storyboard*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true